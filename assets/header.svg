<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090E"/>
      <stop offset="60%" stop-color="#0D131F"/>
      <stop offset="100%" stop-color="#080C14"/>
    </linearGradient>

    <!-- Subtle Radial Glow -->
    <radialGradient id="softGlow" cx="25%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="softPurple" cx="80%" cy="65%" r="50%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0"/>
    </radialGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.25"/>
    </linearGradient>

    <!-- Text Gradients -->
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
  </defs>

  <style>
    .name {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      font-weight: 800;
      font-size: 50px;
      letter-spacing: -1.2px;
      fill: url(#nameGrad);
    }
    .role {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      font-size: 17px;
      font-weight: 400;
      fill: #94A3B8;
      letter-spacing: 0.2px;
    }
    .tag {
      font-family: "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.5px;
      fill: #38BDF8;
    }
    .meta {
      font-family: "SF Mono", Menlo, Consolas, monospace;
      font-size: 12px;
      fill: #64748B;
      letter-spacing: 0.3px;
    }
    .status {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 11px;
      font-weight: 500;
      fill: #A7F3D0;
      letter-spacing: 0.5px;
    }
  </style>

  <!-- Base Card -->
  <rect x="10" y="10" width="1180" height="220" rx="16" fill="url(#bgGrad)"/>
  <rect x="10" y="10" width="1180" height="220" rx="16" fill="url(#softGlow)"/>
  <rect x="10" y="10" width="1180" height="220" rx="16" fill="url(#softPurple)"/>
  <rect x="10" y="10" width="1180" height="220" rx="16" fill="none" stroke="url(#borderGrad)" stroke-width="1"/>

  <!-- Subtle Top Accent Line -->
  <line x1="50" y1="10" x2="250" y2="10" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>

  <!-- Content Group -->
  <g transform="translate(60, 48)">
    <!-- Category Pill -->
    <text x="0" y="10" class="tag">SOFTWARE ENGINEER • AI &amp; CV</text>

    <!-- Main Name Title -->
    <text x="0" y="65" class="name">Belek <tspan fill="url(#blueGrad)">Tazhibaev</tspan></text>

    <!-- Clean Role Subtitle -->
    <text x="0" y="105" class="role">Building Computer Vision pipelines, AI agents, and production software • Bishkek, KG 🇰🇬</text>

    <!-- Meta / Credentials Line -->
    <text x="0" y="145" class="meta">CO-FOUNDER @ COSMIC TEAM • CORE DEV @ AIM EDU (20K+ EXAMS EVALUATED)</text>
  </g>

  <!-- Right-aligned Minimal Status Pill -->
  <g transform="translate(970, 42)">
    <rect x="0" y="0" width="165" height="28" rx="14" fill="#064E3B" fill-opacity="0.3" stroke="#059669" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="15" cy="14" r="3.5" fill="#34D399"/>
    <text x="26" y="18" class="status">AVAILABLE FOR WORK</text>
  </g>
</svg>
