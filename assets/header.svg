<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B11"/>
      <stop offset="50%" stop-color="#0F1420"/>
      <stop offset="100%" stop-color="#0A0D16"/>
    </linearGradient>

    <!-- Glowing Orbs -->
    <radialGradient id="glowBlue" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="85%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowTeal" cx="70%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#0D9488" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0D9488" stop-opacity="0"/>
    </radialGradient>

    <!-- Border Gradients -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.4"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <linearGradient id="accentBlueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-width="0.75" stroke-opacity="0.04"/>
      <circle cx="40" cy="0" r="1.2" fill="#38BDF8" fill-opacity="0.15"/>
    </pattern>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      font-weight: 800;
      font-size: 58px;
      letter-spacing: -1.5px;
      fill: url(#textGrad);
    }
    .badge-text {
      font-family: "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.5px;
      fill: #38BDF8;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      font-size: 20px;
      font-weight: 400;
      fill: #94A3B8;
      letter-spacing: -0.3px;
    }
    .highlight {
      fill: #F8FAFC;
      font-weight: 600;
    }
    .meta-text {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      font-weight: 500;
      fill: #CBD5E1;
    }
    .window-title {
      font-family: "SF Mono", Menlo, monospace;
      font-size: 12px;
      fill: #64748B;
    }
  </style>

  <!-- Card Background -->
  <rect x="10" y="10" width="1180" height="360" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Glowing Orbs inside Card -->
  <rect x="10" y="10" width="1180" height="360" rx="24" fill="url(#glowBlue)"/>
  <rect x="10" y="10" width="1180" height="360" rx="24" fill="url(#glowPurple)"/>
  <rect x="10" y="10" width="1180" height="360" rx="24" fill="url(#glowTeal)"/>
  
  <!-- Subtle Grid -->
  <rect x="10" y="10" width="1180" height="360" rx="24" fill="url(#grid)"/>

  <!-- Card Border -->
  <rect x="10" y="10" width="1180" height="360" rx="24" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Top macOS Window Bar -->
  <g transform="translate(36, 32)">
    <circle cx="8" cy="8" r="6" fill="#FF5F56" stroke="#E0443E" stroke-width="0.5"/>
    <circle cx="28" cy="8" r="6" fill="#FFBD2E" stroke="#DEA123" stroke-width="0.5"/>
    <circle cx="48" cy="8" r="6" fill="#27C93F" stroke="#1AAB29" stroke-width="0.5"/>
    <text x="75" y="12" class="window-title">github.com/Nekono3 • zsh • Bishkek, Kyrgyzstan</text>
    
    <!-- Live Status Pill in Top Right -->
    <g transform="translate(930, -4)">
      <rect x="0" y="0" width="175" height="26" rx="13" fill="#1E293B" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
      <circle cx="14" cy="13" r="4.5" fill="#10B981"/>
      <text x="26" y="17" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#E2E8F0">AVAILABLE FOR WORK</text>
    </g>
  </g>

  <!-- Horizontal Divider -->
  <line x1="10" y1="62" x2="1190" y2="62" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Tag Pill -->
  <g transform="translate(50, 94)">
    <rect x="0" y="0" width="280" height="28" rx="14" fill="#0284C7" fill-opacity="0.14" stroke="#0284C7" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="16" cy="14" r="3.5" fill="#38BDF8"/>
    <text x="28" y="19" class="badge-text">FULL-STACK &amp; AI ENGINEER</text>
  </g>

  <!-- Main Hero Title -->
  <text x="50" y="180" class="title">BELEK • <tspan fill="url(#accentBlueGrad)">NEKONO3</tspan></text>

  <!-- Subtitle / Mission -->
  <text x="50" y="222" class="subtitle">
    17 y.o. developer &amp; founder engineering <tspan class="highlight">Computer Vision</tspan>, <tspan class="highlight">AI agents</tspan> &amp; <tspan class="highlight">scalable systems</tspan>.
  </text>

  <!-- Bottom Metric & Trait Badges -->
  <g transform="translate(50, 265)">
    <!-- Pill 1: Kyrgyz Flag & Location -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="195" height="38" rx="10" fill="#161E2E" fill-opacity="0.85" stroke="#1E293B" stroke-width="1.2"/>
      <text x="14" y="24" font-size="16">🇰🇬</text>
      <text x="40" y="24" class="meta-text">Bishkek, Kyrgyzstan</text>
    </g>

    <!-- Pill 2: 20k+ Sheets -->
    <g transform="translate(208, 0)">
      <rect x="0" y="0" width="240" height="38" rx="10" fill="#161E2E" fill-opacity="0.85" stroke="#1E293B" stroke-width="1.2"/>
      <text x="14" y="24" font-size="16">⚡</text>
      <text x="38" y="24" class="meta-text"><tspan fill="#38BDF8" font-weight="700">20,000+</tspan> Exam Sheets Scored</text>
    </g>

    <!-- Pill 3: 6 Schools Deployed -->
    <g transform="translate(460, 0)">
      <rect x="0" y="0" width="210" height="38" rx="10" fill="#161E2E" fill-opacity="0.85" stroke="#1E293B" stroke-width="1.2"/>
      <text x="14" y="24" font-size="16">🏫</text>
      <text x="38" y="24" class="meta-text"><tspan fill="#34D399" font-weight="700">6 Campuses</tspan> in Production</text>
    </g>

    <!-- Pill 4: Founder -->
    <g transform="translate(682, 0)">
      <rect x="0" y="0" width="225" height="38" rx="10" fill="#161E2E" fill-opacity="0.85" stroke="#1E293B" stroke-width="1.2"/>
      <text x="14" y="24" font-size="16">🚀</text>
      <text x="38" y="24" class="meta-text">Co-Founder @ Cosmic Team</text>
    </g>

    <!-- Pill 5: AI Native -->
    <g transform="translate(919, 0)">
      <rect x="0" y="0" width="180" height="38" rx="10" fill="#161E2E" fill-opacity="0.85" stroke="#1E293B" stroke-width="1.2"/>
      <text x="14" y="24" font-size="16">🤖</text>
      <text x="38" y="24" class="meta-text">AI Agentic Workflow</text>
    </g>
  </g>

  <!-- Corner Graphic / Tech Aesthetic Touch -->
  <g transform="translate(1080, 85)" opacity="0.35">
    <path d="M 0 0 L 50 0 L 50 50" fill="none" stroke="#38BDF8" stroke-width="1.5"/>
    <circle cx="50" cy="50" r="3" fill="#818CF8"/>
  </g>
</svg>
